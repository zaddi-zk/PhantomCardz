<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Marketplace Admin · PhantomCardz</title>
<style>
  :root{--bg:#0a0a0b;--panel:#141416;--panel2:#1b1b1f;--line:#26262c;--txt:#e7e7ea;--mut:#9a9aa6;--acc:#7c5cff;--ok:#33d17a;--warn:#ffb020;--bad:#ff5c5c}
  *{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt)}
  a{color:var(--acc)}
  .app{display:flex;min-height:100vh}
  .side{width:270px;flex:0 0 270px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
  .brand{padding:16px;font-weight:700;border-bottom:1px solid var(--line);line-height:1.25}
  .brand span{font-weight:400;font-size:12px;color:var(--mut)}
  .who{padding:8px 16px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  nav{padding:8px;display:grid;gap:4px}
  .nav{background:transparent;border:1px solid transparent;color:var(--txt);text-align:left;border-radius:8px;padding:9px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer;font:inherit}
  .nav:hover{background:var(--panel2)}
  .nav.active{background:var(--panel2);border-color:var(--line)}
  .badge{color:#1a1200;background:var(--warn);border-radius:999px;font-size:11px;padding:1px 7px;font-weight:700}
  .sidehead{padding:12px 16px 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
  .sidelist{flex:1;overflow:auto;padding:0 8px 8px;display:grid;gap:3px;align-content:start}
  .sellerbtn{display:flex;gap:8px;align-items:center;background:transparent;border:1px solid transparent;color:var(--txt);border-radius:8px;padding:8px 10px;cursor:pointer;text-align:left;font:inherit;width:100%}
  .sellerbtn:hover{background:var(--panel2)}
  .sellerbtn.active{background:var(--panel2);border-color:var(--line)}
  .sellerbtn .se{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--mut);flex:0 0 8px}
  .dot.approved{background:var(--ok)}.dot.pending{background:var(--warn)}.dot.rejected,.dot.suspended{background:var(--bad)}
  .links{padding:12px 16px;border-top:1px solid var(--line);display:flex;gap:14px;font-size:13px}
  .main{flex:1;min-width:0;padding:22px;display:grid;gap:18px;align-content:start}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
  .card h2{margin:0 0 12px;font-size:14px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
  input,select,textarea{background:#0f0f12;border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 9px;font:inherit}
  button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:7px 12px;font:inherit;cursor:pointer}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--txt)}button.ok{background:var(--ok);color:#04120a}button.bad{background:var(--bad)}
  table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
  th{color:var(--mut);font-weight:600}.muted{color:var(--mut)}
  .pill{padding:2px 8px;border-radius:999px;font-size:12px;border:1px solid var(--line)}
  .pill.pending,.pill.requested{color:var(--warn)}.pill.active,.pill.approved,.pill.paid{color:var(--ok)}.pill.rejected,.pill.suspended{color:var(--bad)}
  .pagehead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
  .pagehead h2{margin:0;font-size:20px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
  .stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
  .stat .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
  .stat .v{font-size:20px;font-weight:700;margin-top:4px}
  .sub{font-size:12px;margin:14px 0 6px;color:var(--mut);text-transform:uppercase;letter-spacing:.05em}
  .actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .toast{position:fixed;bottom:18px;right:18px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 16px;opacity:0;transition:.2s;max-width:340px;z-index:10}
  .toast.show{opacity:1}.hidden{display:none!important}
  @media(max-width:820px){.app{flex-direction:column}.side{position:static;height:auto;width:auto;flex:auto}.sidelist{max-height:220px}.main{padding:14px}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand">PhantomCardz<br><span>Marketplace Admin</span></div>
    <div class="who muted" id="who">…</div>
    <nav id="nav">
      <button class="nav active" data-view="sellers">Sellers</button>
      <button class="nav" data-view="applications">Applications <span id="appCount" class="badge hidden"></span></button>
      <button class="nav" data-view="listings">Listings <span id="pendCount" class="badge hidden"></span></button>
      <button class="nav" data-view="payouts">Payouts <span id="payCount" class="badge hidden"></span></button>
    </nav>
    <div class="sidehead">Sellers</div>
    <div id="sideSellers" class="sidelist"></div>
    <div class="links"><a href="/seller">Seller view</a><a href="/admin">Admin</a><a href="/">Store</a></div>
  </aside>
  <main class="main" id="view"></main>
</div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s);
const money=c=>"$"+((c||0)/100).toFixed(2);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("show"),3200);}
async function api(path,opts={}){opts.credentials="include";if(opts.body&&typeof opts.body!=="string"){opts.headers=Object.assign({"Content-Type":"application/json"},opts.headers||{});opts.body=JSON.stringify(opts.body);}const r=await fetch(path,opts);let d={};try{d=await r.json();}catch(e){}if(!r.ok){const e=new Error(d.message||("HTTP "+r.status));e.status=r.status;throw e;}return d;}
function btn(label,cls,fn){const b=document.createElement("button");b.textContent=label;if(cls)b.className=cls;b.onclick=fn;return b;}
function pill(s){return `<span class="pill ${esc(s)}">${esc(s)}</span>`;}

const S={sellers:[],applications:[],listings:null,payouts:[],view:"sellers",sellerId:null};

function setBadge(id,n){const e=$(id);e.textContent=n||"";e.classList.toggle("hidden",!n);}

async function boot(){
  let u;try{u=await api("/api/user");}catch(e){if(e.status===401){location.href="/auth";return;}throw e;}
  if(u.rank!=="admin"){document.body.innerHTML='<p style="padding:40px">Admins only. <a href="/">Home</a></p>';return;}
  $("#who").textContent=u.email;
  $("#nav").addEventListener("click",e=>{const b=e.target.closest(".nav");if(b)show(b.dataset.view);});
  try{await loadAll();}catch(e){toast(e.message);}
  show("sellers");
}

async function loadAll(){
  const [s,l,p]=await Promise.all([api("/api/admin/sellers"),api("/api/admin/listings"),api("/api/admin/payouts")]);
  S.sellers=s.sellers||[];S.applications=s.applications||[];S.listings=l;S.payouts=p||[];
  setBadge("#appCount",S.applications.filter(a=>a.status==="pending").length);
  setBadge("#pendCount",(l.products||[]).filter(x=>x.status!=="active").length);
  setBadge("#payCount",S.payouts.filter(x=>x.status==="requested").length);
  renderSideSellers();
}

function renderSideSellers(){
  const box=$("#sideSellers");box.innerHTML="";
  if(!S.sellers.length){box.innerHTML='<p class="muted" style="padding:2px 10px">No sellers yet.</p>';return;}
  for(const s of S.sellers){
    const b=document.createElement("button");
    b.className="sellerbtn"+(S.view==="detail"&&S.sellerId===s.userId?" active":"");
    b.innerHTML=`<span class="dot ${esc(s.status)}"></span><span class="se">${esc(s.email||s.userId)}</span>`;
    b.onclick=()=>showDetail(s.userId);
    box.append(b);
  }
}

function show(view){
  S.view=view;
  document.querySelectorAll("#nav .nav").forEach(b=>b.classList.toggle("active",b.dataset.view===view));
  renderSideSellers();
  const v=$("#view");
  if(view==="sellers")renderSellers(v);
  else if(view==="applications")renderApplications(v);
  else if(view==="listings")renderListings(v);
  else if(view==="payouts")renderPayouts(v);
}

/* ---------------- Sellers overview ---------------- */
function renderSellers(v){
  const rows=S.sellers.map(s=>`<tr>
    <td>${esc(s.email||s.userId)}<div class="muted">${esc(s.username||"")}</div></td>
    <td>${esc(s.sellerCode||"")}</td>
    <td>${pill(s.status)}</td>
    <td data-c="${s.userId}"></td>
    <td>${money(s.balances.availableCents)}</td>
    <td>${money(s.balances.committedCents)}</td>
    <td data-a="${s.userId}" style="white-space:nowrap"></td>
  </tr>`).join("");
  v.innerHTML=`<div class="pagehead"><div><h2>Seller accounts</h2><div class="muted">${S.sellers.length} seller(s)</div></div></div>
  <section class="card"><div style="overflow:auto"><table><thead><tr><th>User</th><th>Code</th><th>Status</th><th>Commission %</th><th>Available</th><th>Committed</th><th></th></tr></thead>
  <tbody>${rows||'<tr><td colspan="7" class="muted">No sellers yet.</td></tr>'}</tbody></table></div></section>`;
  for(const s of S.sellers){
    const cc=v.querySelector(`[data-c="${s.userId}"]`);
    const inp=document.createElement("input");inp.type="number";inp.step="0.01";inp.value=((s.commissionBps||0)/100).toFixed(2);inp.style.width="80px";
    cc.append(inp,btn("Save","ghost",async()=>{try{await api(`/api/admin/sellers/${s.userId}`,{method:"PATCH",body:{commissionBps:Math.round(parseFloat(inp.value||0)*100)}});toast("Saved");S.sellers=[];await loadAll();show("sellers");}catch(e){toast(e.message);}}));
    const ac=v.querySelector(`[data-a="${s.userId}"]`);
    ac.append(btn("View","ok",()=>showDetail(s.userId)));
    ac.append(btn("Suspend","bad",async()=>{try{await api(`/api/admin/sellers/${s.userId}/suspend`,{method:"POST",body:{}});toast("Suspended");await loadAll();show("sellers");}catch(e){toast(e.message);}}));
  }
}

/* ---------------- Applications ---------------- */
function renderApplications(v){
  const rows=S.applications.map(a=>`<tr>
    <td>${esc(a.email||a.userId)}<div class="muted">${esc(a.telegram||"")}</div></td>
    <td style="max-width:360px">${esc(a.motivation||"")}</td>
    <td>${pill(a.status)}</td>
    <td data-c="${a.userId}"></td>
    <td data-a="${a.userId}" style="white-space:nowrap"></td>
  </tr>`).join("");
  v.innerHTML=`<div class="pagehead"><div><h2>Seller applications</h2><div class="muted">${S.applications.length} total</div></div></div>
  <section class="card"><div style="overflow:auto"><table><thead><tr><th>User</th><th>Motivation</th><th>Status</th><th>Commission %</th><th></th></tr></thead>
  <tbody>${rows||'<tr><td colspan="5" class="muted">No applications.</td></tr>'}</tbody></table></div></section>`;
  for(const a of S.applications){
    const cc=v.querySelector(`[data-c="${a.userId}"]`);
    const inp=document.createElement("input");inp.type="number";inp.step="0.01";inp.value="15";inp.style.width="80px";
    cc.append(inp);
    const ac=v.querySelector(`[data-a="${a.userId}"]`);
    ac.append(btn("Approve","ok",async()=>{try{await api(`/api/admin/sellers/${a.userId}/approve`,{method:"POST",body:{commissionBps:Math.round(parseFloat(inp.value||15)*100)}});toast("Approved");await loadAll();show("applications");}catch(e){toast(e.message);}}));
    ac.append(btn("Reject","bad",async()=>{try{await api(`/api/admin/sellers/${a.userId}/reject`,{method:"POST",body:{}});toast("Rejected");await loadAll();show("applications");}catch(e){toast(e.message);}}));
  }
}

/* ---------------- Listings ---------------- */
function renderListings(v){
  const d=S.listings||{products:[],cardBases:[]};
  const pending=(d.products||[]).filter(p=>p.status!=="active");
  const table=(items,pendingMode)=>{
    const body=items.map(p=>`<tr>
      <td>${esc(p.name)} <span class="muted">#${p.id}</span></td>
      <td class="muted">${esc(p.ownerEmail||("owner "+p.ownerId))}</td>
      <td>${pill(p.status)}</td>
      <td>${esc((p.variants||[]).map(x=>x.name+" ("+x.stockCount+")").join(", "))||"—"}</td>
      <td data-r="${p.id}" style="white-space:nowrap"></td>
    </tr>`).join("");
    return `<table><thead><tr><th>Product</th><th>Owner</th><th>Status</th><th>Variants</th><th></th></tr></thead><tbody>${body||'<tr><td colspan="5" class="muted">None.</td></tr>'}</tbody></table>`;
  };
  v.innerHTML=`<div class="pagehead"><div><h2>Listings review</h2><div class="muted">${(d.products||[]).length} product(s) · ${(d.cardBases||[]).length} card base(s)</div></div></div>
    <section class="card"><h2>Awaiting review (${pending.length})</h2><div style="overflow:auto">${table(pending,true)}</div></section>
    <section class="card"><h2>All listings</h2><div style="overflow:auto">${table(d.products||[],false)}</div></section>`;
  v.querySelectorAll("[data-r]").forEach(td=>{
    const id=Number(td.dataset.r);
    const p=(d.products||[]).find(x=>x.id===id)||{};
    if(p.status!=="active")td.append(btn("Approve","ok",()=>review(id,"active")),btn("Reject","bad",()=>review(id,"rejected")));
    else td.append(btn("Unlist","ghost",()=>review(id,"pending")));
  });
}
async function review(id,status){try{await api(`/api/admin/products/${id}/review`,{method:"PATCH",body:{status}});toast("Set "+status);await loadAll();show("listings");}catch(e){toast(e.message);}}

/* ---------------- Payouts ---------------- */
function renderPayouts(v){
  const rows=S.payouts.map(p=>`<tr>
    <td>#${p.id}</td><td>${esc(p.email||p.sellerId)}</td><td>${money(p.amountCents)}</td>
    <td>${esc(p.method||"")}</td><td>${esc(p.destination||"")}</td><td>${pill(p.status)}</td>
    <td data-p="${p.id}" style="white-space:nowrap"></td></tr>`).join("");
  v.innerHTML=`<div class="pagehead"><div><h2>Payouts</h2><div class="muted">${S.payouts.filter(p=>p.status==="requested").length} awaiting action</div></div></div>
  <section class="card"><div style="overflow:auto"><table><thead><tr><th>#</th><th>Seller</th><th>Amount</th><th>Method</th><th>Destination</th><th>Status</th><th></th></tr></thead>
  <tbody>${rows||'<tr><td colspan="7" class="muted">No payouts.</td></tr>'}</tbody></table></div></section>`;
  for(const p of S.payouts){
    const td=v.querySelector(`[data-p="${p.id}"]`);
    if(p.status==="requested")td.append(btn("Approve","ghost",()=>act(p.id,"approve")));
    if(p.status==="requested"||p.status==="approved")td.append(btn("Mark paid","ok",()=>act(p.id,"pay")),btn("Reject","bad",()=>act(p.id,"reject")));
  }
}
async function act(id,a){try{await api(`/api/admin/payouts/${id}/${a}`,{method:"POST",body:{}});toast("Payout "+a);await loadAll();show("payouts");}catch(e){toast(e.message);}}

/* ---------------- Single seller: full data ---------------- */
async function showDetail(uid){
  S.view="detail";S.sellerId=uid;
  document.querySelectorAll("#nav .nav").forEach(b=>b.classList.remove("active"));
  renderSideSellers();
  const v=$("#view");v.innerHTML='<p class="muted">Loading…</p>';
  let d;try{d=await api(`/api/admin/sellers/${uid}`);}catch(e){v.innerHTML=`<p style="color:var(--bad)">${esc(e.message)}</p>`;return;}
  const u=d.user,acct=d.account,b=d.balances;
  const stat=(k,val)=>`<div class="stat"><div class="k">${k}</div><div class="v">${val}</div></div>`;
  const prodHtml=(d.products||[]).map(p=>`<div class="card" style="margin-top:10px">
    <div style="display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap">
      <div><b>${esc(p.name)}</b> <span class="muted">#${p.id}</span><div class="muted" style="font-size:12px">${esc(p.description||"")}</div></div>
      <div>${pill(p.status)}</div>
    </div>
    <table style="margin-top:8px"><thead><tr><th>Variant</th><th>Price</th><th>Stock</th><th>Sold</th></tr></thead>
    <tbody>${(p.variants||[]).map(x=>`<tr><td>${esc(x.name)}</td><td>${money(x.priceCents)}</td><td>${x.stockCount}</td><td>${x.soldCount}</td></tr>`).join("")||'<tr><td colspan="4" class="muted">No variants.</td></tr>'}</tbody></table>
  </div>`).join("")||'<p class="muted">No products.</p>';
  const baseHtml=(d.cardBases||[]).map(x=>`<tr><td>${esc(x.name)} <span class="muted">#${x.id}</span></td><td>${money(x.priceCents)}</td><td>${x.active?"yes":"no"}</td><td>${x.stockCount}</td><td>${x.soldCount}</td></tr>`).join("");
  const salesHtml=(d.sales||[]).map(s=>`<tr><td>#${s.orderId}</td><td>${esc(s.itemName||("card #"+s.refId))}</td><td>${esc(s.buyer||"—")}</td><td>${money(s.grossCents)}</td><td>${money(s.feeCents)}</td><td>${money(s.netCents)}</td><td>${pill(s.status)}</td><td class="muted">${esc(s.availableAt||"")}</td></tr>`).join("");
  const payHtml=(d.payouts||[]).map(p=>`<tr><td>#${p.id}</td><td>${money(p.amountCents)}</td><td>${esc(p.method||"")}</td><td>${esc(p.destination||"")}</td><td>${pill(p.status)}</td><td class="muted">${esc(p.createdAt||"")}</td></tr>`).join("");

  v.innerHTML=`
  <div class="pagehead">
    <div>
      <h2>${esc(u.email||("user #"+u.id))}</h2>
      <div class="muted">${esc(u.username||"")} · rank <b>${esc(u.rank)}</b> · ${acct?pill(acct.status):'<span class="muted">no seller account</span>'} ${acct&&acct.sellerCode?"· code "+esc(acct.sellerCode):""} · joined ${esc(u.createdAt||"")}</div>
    </div>
    <div class="actions" id="detailActions"></div>
  </div>

  <div class="grid">
    ${stat("Pending (escrow)",money(b.pendingCents))}
    ${stat("Available",money(b.availableCents))}
    ${stat("Committed",money(b.committedCents))}
    ${stat("Withdrawable",money(b.withdrawableCents))}
    ${stat("Gross earned",money(b.grossCents))}
    ${stat("Platform fees",money(b.feeCents))}
    ${stat("Reversed",money(b.reversedCents))}
    ${stat("Wallet balance",money(u.balanceCents))}
  </div>

  <section class="card">
    <h2>Account</h2>
    <div class="actions">
      <span class="muted">Commission %</span><input type="number" step="0.01" id="dComm" style="width:90px" value="${((d.commissionBps||0)/100).toFixed(2)}">
      <span class="muted">Payout hold: ${d.holdHours}h</span>
      <span class="muted">Telegram: ${esc(u.telegram||"—")}</span>
    </div>
  </section>

  <section class="card"><h2>Products (${(d.products||[]).length})</h2>${prodHtml}</section>
  <section class="card"><h2>Card bases (${(d.cardBases||[]).length})</h2><div style="overflow:auto"><table><thead><tr><th>Base</th><th>Price</th><th>Active</th><th>Stock</th><th>Sold</th></tr></thead><tbody>${baseHtml||'<tr><td colspan="5" class="muted">No card bases.</td></tr>'}</tbody></table></div></section>
  <section class="card"><h2>Sales (${(d.sales||[]).length})</h2><div style="overflow:auto"><table><thead><tr><th>Order</th><th>Item</th><th>Buyer</th><th>Gross</th><th>Fee</th><th>Net</th><th>Status</th><th>Available</th></tr></thead><tbody>${salesHtml||'<tr><td colspan="8" class="muted">No sales.</td></tr>'}</tbody></table></div></section>
  <section class="card"><h2>Payouts (${(d.payouts||[]).length})</h2><div style="overflow:auto"><table><thead><tr><th>#</th><th>Amount</th><th>Method</th><th>Destination</th><th>Status</th><th>Created</th></tr></thead><tbody>${payHtml||'<tr><td colspan="6" class="muted">No payouts.</td></tr>'}</tbody></table></div></section>`;

  const A=v.querySelector("#detailActions");
  A.append(btn("Save commission","ghost",async()=>{try{await api(`/api/admin/sellers/${uid}`,{method:"PATCH",body:{commissionBps:Math.round(parseFloat(v.querySelector("#dComm").value||0)*100)}});toast("Saved");showDetail(uid);await loadAll();}catch(e){toast(e.message);}}));
  if(!acct||acct.status!=="approved")A.append(btn("Approve","ok",async()=>{try{await api(`/api/admin/sellers/${uid}/approve`,{method:"POST",body:{commissionBps:Math.round(parseFloat(v.querySelector("#dComm").value||15)*100)}});toast("Approved");showDetail(uid);await loadAll();}catch(e){toast(e.message);}}));
  if(acct&&acct.status==="approved")A.append(btn("Suspend","bad",async()=>{try{await api(`/api/admin/sellers/${uid}/suspend`,{method:"POST",body:{}});toast("Suspended");showDetail(uid);await loadAll();}catch(e){toast(e.message);}}));
}

boot().catch(e=>toast(e.message));
</script>
</body>
</html>
